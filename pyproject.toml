[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portcullis"
version = "0.1.0"
description = "Self-hosted shield that blocks brute-force logins on Windows RDP and Linux SSH, with a dashboard and chat alerts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Basil Saji Mathew" }]
keywords = ["security", "rdp", "ssh", "brute-force", "fail2ban", "firewall", "self-hosted", "intrusion-prevention"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Networking :: Firewalls",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/BASIL-SAJI-MATHEW/portcullis"
Issues = "https://github.com/BASIL-SAJI-MATHEW/portcullis/issues"

[project.scripts]
portcullis = "portcullis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portcullis = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
